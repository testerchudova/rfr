name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      auth: ${{ steps.filter.outputs.auth }}
      api: ${{ steps.filter.outputs.api }}
      e2e: ${{ steps.filter.outputs.e2e }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - build.gradle
              - settings.gradle
              - gradle.properties
              - gradlew
              - gradlew.bat
              - gradle/**
            auth:
              - rfr-auth/**
            api:
              - rfr-api/**
            e2e:
              - rfr-e2e/**
            frontend:
              - rfr-gql-client/**
            workflow:
              - .github/workflows/ci.yml
              - scripts/ci/**

  backend:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.auth == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - env:
          WORKFLOW: ${{ needs.changes.outputs.workflow }}
          SHARED: ${{ needs.changes.outputs.shared }}
          AUTH: ${{ needs.changes.outputs.auth }}
          API: ${{ needs.changes.outputs.api }}
          E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          tasks=()
          [[ $WORKFLOW == true ]] && SHARED=true
          [[ $SHARED == true || $AUTH == true ]] && tasks+=(:rfr-auth:build)
          [[ $SHARED == true || $API == true ]] && tasks+=(:rfr-api:build)
          [[ $SHARED == true || $E2E == true ]] && tasks+=(:rfr-e2e:testClasses)
          ./gradlew "${tasks[@]}"

  frontend:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rfr-gql-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    needs: changes
    if: >-
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_AUTH_URL: http://localhost:9001
      VITE_API_URL: http://localhost:8081
      VITE_FRONT_HOST: 127.0.0.1
      VITE_FRONT_URL: http://localhost:3001
      VITE_CLIENT_ID: client
      RFR_HEADLESS: 'true'
    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - uses: gradle/actions/setup-gradle@v5
      - name: Check service readiness helper
        run: node --test scripts/ci/wait-for-ports.test.mjs
      - name: Install frontend dependencies
        run: npm --prefix rfr-gql-client ci
      - name: Install Chromium and Linux dependencies
        run: ./gradlew :rfr-e2e:installPlaywrightWithDeps
      - name: Start the application and wait for ports
        run: |
          mkdir -p build/ci-logs
          started=$SECONDS
          ./gradlew --console=plain runAll > build/ci-logs/backend.log 2>&1 &
          npm --prefix rfr-gql-client run dev -- --strictPort > build/ci-logs/frontend.log 2>&1 &
          node scripts/ci/wait-for-ports.mjs 9001 8081 3001
          printf 'Stand startup: %s seconds\n' "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"
      - name: Run E2E tests
        run: |
          started=$SECONDS
          set +e
          ./gradlew --console=plain e2e
          test_exit_code=$?
          set -e
          printf 'E2E tests: %s seconds; exit code: %s\n' "$((SECONDS - started))" "$test_exit_code" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit_code"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-allure-results
          path: rfr-e2e/build/allure-results
          if-no-files-found: warn
          retention-days: 7
      - name: Upload service logs and JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            build/ci-logs
            rfr-e2e/build/test-results/test
            rfr-e2e/build/reports/tests/test
          if-no-files-found: warn
          retention-days: 7
